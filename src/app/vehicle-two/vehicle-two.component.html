 <div class="table-responsive">

    <input type="text" placeholder="Search Vehicles..." [(ngModel)]="term" (keyup)="search()">
    <button routerLink="/dashbord/createvehicle">Create Vehicle details</button>
        <table class="table custom-table align-middle">

          <thead>
            <tr>
              <th>#</th>
              <th>Image</th>
              <th>Vehicle</th>
              <th>Manufacturer</th>
              <th>Model</th>
              <th>Type</th>
              <th (click)="sort('fuel')">Fuel</th>
              <th (click)="sort('color')">Color</th>
              <th>Cost</th>
              <th>Tyres</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody>

            <tr *ngFor="let v of vehicles; ">

              <td>{{v.id}}</td>

              <td>
                <img src="{{v.image}}" class="vehicle-img">
              </td>

              <td class="vehicle-name" >{{v.Vehicle  }} </td>

              <td>{{v.manufacturer}}</td>

              <td>{{v.model}}</td>

              <td >
                <span class="badge type-badge">{{v.type}}</span>
              </td>

              <td>
                <span class="badge fuel-badge">{{v.fuel}}</span>
              </td>

              <td>{{v.color}}</td>

              <td class="price">₹ {{v.cost}}</td>

              <td>{{v.tyres}}</td>

              <td>
                <!-- <button 
                class="btn btn-danger btn-sm delete-btn"
                (click)="deleteVehicle(v.id)">
                Delete
                </button> -->
              </td>

              <td>
                <button (click)="edite()">Edit</button>
              </td>

               <td>
                <button routerLink="/dashbord/view-vehicle/{{v.id}}">View</button>
              </td>

            </tr>

          </tbody>

        </table>
<div>
  
   <button *ngFor="let x of [].constructor(8); let i=index" 
   (click)="gotvehicle(i + 1)">{{i+ 1}}</button>
        

</div>
       

      </div>
