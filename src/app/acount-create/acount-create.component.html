<!-- Account Form Component -->
<form class="account-form">

  <div class="form-row">
    <label>Account Name</label>
    <input type="text" name="account_name" placeholder="Enter account name">
  </div>

  <div class="form-row">
    <label>Available Balance</label>
    <input type="number" name="available_balance" step="0.01" placeholder="Enter balance">
  </div>

  <div class="form-row">
    <label>Account Number</label>
    <input type="text" name="account_number" placeholder="Enter account number">
  </div>

  <div class="form-row">
    <label>City</label>
    <input type="text" name="city" placeholder="Enter city">
  </div>

  <div class="form-row">
    <label>Profile Picture URL</label>
    <input type="url" name="profie_picture" placeholder="Enter image URL">
  </div>

  <div class="form-row">
    <label>IFSC Code</label>
    <input type="text" name="ifsc_code" placeholder="Enter IFSC code">
  </div>

  <div class="form-row">
    <label>ID</label>
    <input type="text" name="id" placeholder="Enter ID">
  </div>

  <button type="submit" class="form-btn">
    Submit Account
  </button>

</form>
