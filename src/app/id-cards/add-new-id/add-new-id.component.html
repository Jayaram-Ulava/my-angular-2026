<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<div class="container form-container mt-5">
    <form [formGroup]="addForm" class="p-4 shadow rounded bg-white">
<p routerLink="/dashbord/idcard/idcards">❌</p>
        <h1>{{updateid?"Edite ID Card":"Add New Id Card"}}</h1>
        <h3 class="text-center mb-4">Student Registration</h3>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" formControlName="name" placeholder="Enter Name">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Phone</label>
                <input type="text" class="form-control" formControlName="phone" placeholder="Enter Phone">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Date of Birth</label>
                <input type="date" class="form-control" formControlName="dob">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" formControlName="email" placeholder="Enter Email">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Profile Picture URL</label>
                <input type="text" class="form-control" formControlName="profile_picture" placeholder="Image URL">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">School Logo URL</label>
                <input type="text" class="form-control" formControlName="school_logo" placeholder="Logo URL">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">School Name</label>
                <input type="text" class="form-control" formControlName="school_name">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">School City</label>
                <input type="text" class="form-control" formControlName="school_city">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">School Pin</label>
                <input type="text" class="form-control" formControlName="school_pin">
            </div>

        </div>

        <div class="text-center mt-3">
            <button class="btn btn-primary px-5" (click)="submit()">Submit</button>
        </div>

    </form>
</div>
