<div class="container mt-5">

  
  <div class="accounts-wrapper">
    <input type="text" [(ngModel)]="term" placeholder="Search accounts..." class="form-control mb-3" (keyup)="searchacout()">

    <h2 class="title text-center mb-4">
      Account Management
    </h2>

    <div class="table-responsive">

      <table class="table table-hover accounts-table">

        <thead>
          <tr>
            <th>#</th>
            <th>Profile</th>
            <th (click)="sort('account_name')">Account Name</th>
            <th (click)="sort('account_number')">Account Number</th>
            <th (click)="sort('city')">City</th>
            <th (click)="sort('available_balance')">Available Balance</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let acc of acounts; let i=index">

            <td>{{acc.id}}</td>

            <td>
              <img
              [src]="acc.profie_picture || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'"
              class="profile-image">
            </td>

            <td class="account-name">
              {{acc.account_name || 'Not Available'}}
            </td>

            <td>
              {{acc.account_number || 'N/A'}}
            </td>

            <td>
              {{acc.city || 'N/A'}}
            </td>

            <td class="balance">
              ₹ {{acc.available_balance || 0}}
            </td>
            <td class="actions">
              <button class="btn btn-danger btn-sm delete-btn" (click)="deleteacout(acc.id)">
                Delete
              </button>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>
  <div>
    <button (click)="prev()">prev</button>
    <button *ngFor="let x of [].constructor(10); let i=index"
 (click)="pagenaction(i+1)">
  {{i+1}}
</button>

<button (click)="next()">next</button>

  </div>
 

</div>
